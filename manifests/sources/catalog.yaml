sources:
  - id: survivalmanual-wiki
    title: SurvivalManual Wiki
    description: Offline survival guide based on the public-domain US Army survival manual.
    type: repo-archive
    category: survival
    tags:
      [
        survival/water,
        survival/fire,
        survival/shelter,
        survival/food,
        first-aid
      ]
    license: public-domain-derived
    attribution: ligi/SurvivalManual contributors; based on US Army FM 3-05.70.
    url: https://github.com/ligi/SurvivalManual.wiki.git
    source_url: https://github.com/ligi/SurvivalManual/wiki
    artifact_name: survivalmanual-wiki-content.zip
    expected_size_bytes: 6000000
    expected_extracted_size_bytes: 12000000
    sha256: null
    download:
      action: git_archive
    runtime: [ browse, index, search, ai ]
    open:
      action: extract_serve
      label: Extract Markdown wiki and open it in a local browser tab.
      entry: .
    profiles:
      [
        survival-essential,
        survival-plus,
        civilization-core,
        civilization-rebuild,
        civilization-max
      ]
    language: en
  - id: survivalmanual-ebook
    title: SurvivalManual ebook
    description: Printable/e-reader oriented SurvivalManual build.
    type: repo-archive
    category: survival
    tags: [ survival, first-aid ]
    license: public-domain-derived
    attribution: inferno986return/SurvivalManual-ebook contributors.
    url: https://github.com/inferno986return/SurvivalManual-ebook/archive/refs/heads/main.zip
    mirrors:
