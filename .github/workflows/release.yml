name: Desktop Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run validation suite
        run: npm run validate

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os: linux
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
          - label: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            os: macos
          - label: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            os: macos
          - label: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            os: windows
          - label: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            os: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            zstd \
            zip \
            rpm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Cache vcpkg packages (Windows)
        if: matrix.os == 'windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libzim-xapian-${{ matrix.target }}-${{ hashFiles('node_modules/@openzim/libzim/package.json') }}

      - name: Build @openzim/libzim native addon (Linux/macOS)
        if: matrix.os != 'windows'
        run: npm rebuild @openzim/libzim

      - name: Build @openzim/libzim native addon (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: node tools/build-libzim-windows.mjs
        env:
          VCPKG_ROOT: C:\vcpkg
          TARGET_ARCH: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'x64' }}

      - name: Validate manifests
        run: npm run lint:manifests

      - name: Build web UI
        run: npm run build

      - name: Prepare Tauri sidecars
        run: npm run sidecars:prepare
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.target }}

      - name: Build desktop app
        run: npm run tauri:build -- --target ${{ matrix.target }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Collect artifact files
        shell: bash
        run: |
          set -euo pipefail
          dest="release-artifacts/Offline-Survival-${{ matrix.label }}"
          mkdir -p "$dest"
          find app/src-tauri/target -path "*/bundle/*" -type f \
            \( -name "*.AppImage" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" \) \
            -exec cp {} "$dest/" \;
          # Keep AppImages executable so the shipped archive carries the exec bit.
          find "$dest" -name "*.AppImage" -exec chmod +x {} \;
          cp "tools/release-readme/${{ matrix.os }}.txt" "$dest/README-FIRST.txt"
          echo "Collected files for ${{ matrix.label }}:"
          ls -la "$dest"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Offline-Survival-${{ matrix.label }}
          path: release-artifacts/Offline-Survival-${{ matrix.label }}
          if-no-files-found: error

  verify:
    name: Verify ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Verify Linux on a NEWER runner than the build host so forward-compat
          # library mismatches (e.g. the AppImage GLib/WebKit symbols) surface.
          - label: linux-x64
            runner: ubuntu-24.04
            os: linux
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
          - label: macos-x64
            runner: macos-15-intel
            os: macos
          - label: macos-arm64
            runner: macos-14
            os: macos
          - label: windows-x64
            runner: windows-2022
            os: windows
          - label: windows-arm64
            runner: windows-11-arm
            os: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Offline-Survival-${{ matrix.label }}
          path: artifact

      - name: Install Linux verification tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool imagemagick dbus-x11 openbox
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Start virtual display (Linux)
        if: matrix.os == 'linux'
        run: |
          Xvfb :99 -screen 0 1600x1000x24 >/tmp/xvfb.log 2>&1 &
          sleep 2
          DISPLAY=:99 openbox >/tmp/openbox.log 2>&1 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Verify package (Linux/macOS)
        if: matrix.os != 'windows'
        shell: bash
        env:
          VERIFY_SHOT_DIR: ${{ github.workspace }}/verify-screenshots
        run: bash tools/verify-package.sh "${{ matrix.os }}" artifact

      - name: Verify package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          VERIFY_SHOT_DIR: ${{ github.workspace }}/verify-screenshots
        run: ./tools/verify-package.ps1 -ArtifactDir artifact

      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots-${{ matrix.label }}
          path: verify-screenshots
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Choose release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            name="Offline Survival ${GITHUB_REF_NAME}"
          else
            tag="main-${GITHUB_RUN_NUMBER}-${short_sha}"
            name="Offline Survival latest (${short_sha})"
          fi
          {
            echo "tag=${tag}"
            echo "name=${name}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Build release archives
        run: |
          set -euo pipefail
          mkdir -p release-upload all-platforms/Offline-Survival-all-platforms per-platform
          # upload-artifact drops the executable bit; restore it so the shipped
          # AppImage runs on a double-click instead of doing nothing.
          find downloaded-artifacts -name "*.AppImage" -exec chmod +x {} \;
          for dir in downloaded-artifacts/Offline-Survival-*; do
            name="$(basename "$dir")"
            cp -R "$dir" "all-platforms/Offline-Survival-all-platforms/${name}"
          done

          cp tools/release-readme/all-platforms.txt "all-platforms/Offline-Survival-all-platforms/README-FIRST.txt"

          (cd all-platforms && zip -qr "../release-upload/Offline-Survival-all-platforms.zip" Offline-Survival-all-platforms)

          for dir in downloaded-artifacts/Offline-Survival-*; do
            name="$(basename "$dir")"
            (cd "$(dirname "$dir")" && zip -qr "../release-upload/${name}.zip" "$(basename "$dir")")
          done

          sha256sum release-upload/*.zip > release-upload/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.name }}
          files: release-upload/*
          generate_release_notes: true
          make_latest: true
