name: Desktop Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "manifests/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run validation suite
        run: npm run validate

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os: linux
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
          - label: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            os: macos
          - label: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            os: macos
          - label: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            os: windows
          - label: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            os: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            zstd \
            zip

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Cache vcpkg packages (Windows)
        if: matrix.os == 'windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libzim-${{ matrix.target }}-${{ hashFiles('node_modules/@openzim/libzim/package.json') }}

      - name: Build @openzim/libzim native addon (Linux/macOS)
        if: matrix.os != 'windows'
        run: npm rebuild @openzim/libzim

      - name: Build @openzim/libzim native addon (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: node tools/build-libzim-windows.mjs
        env:
          VCPKG_ROOT: C:\vcpkg
          TARGET_ARCH: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'x64' }}

      - name: Validate manifests
        run: npm run lint:manifests

      - name: Build web UI
        run: npm run build

      - name: Prepare Tauri sidecars
        run: npm run sidecars:prepare
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.target }}

      - name: Build desktop app
        run: npm run tauri:build -- --target ${{ matrix.target }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Collect artifact files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "release-artifacts/Offline-Survival-${{ matrix.label }}"
          find app/src-tauri/target -path "*/bundle/*" -type f \
            \( -name "*.AppImage" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" \) \
            -exec cp {} "release-artifacts/Offline-Survival-${{ matrix.label }}/" \;
          cat > "release-artifacts/Offline-Survival-${{ matrix.label }}/README-FIRST.txt" <<EOF
          Offline Survival ${{ matrix.label }}

          Open the installer or app package for this platform.
          Downloaded knowledge sources are not included in this release artifact.
          Use the app to choose a library folder and install the profile you want.
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Offline-Survival-${{ matrix.label }}
          path: release-artifacts/Offline-Survival-${{ matrix.label }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Build release archives
        run: |
          set -euo pipefail
          mkdir -p release-upload all-platforms/Offline-Survival-all-platforms per-platform
          for dir in downloaded-artifacts/Offline-Survival-*; do
            name="$(basename "$dir")"
            cp -R "$dir" "all-platforms/Offline-Survival-all-platforms/${name}"
          done

          cat > "all-platforms/Offline-Survival-all-platforms/README-FIRST.txt" <<'EOF'
          Offline Survival all-platforms bundle

          This folder contains app release files for Windows, macOS, and Linux.
          Use it with the app Share tab when creating a USB/share package for mixed operating systems.
          Downloaded knowledge sources are not included here; share packages add the selected local library data.
          EOF

          (cd all-platforms && zip -qr "../release-upload/Offline-Survival-all-platforms.zip" Offline-Survival-all-platforms)

          for dir in downloaded-artifacts/Offline-Survival-*; do
            name="$(basename "$dir")"
            (cd "$(dirname "$dir")" && zip -qr "../release-upload/${name}.zip" "$(basename "$dir")")
          done

          sha256sum release-upload/*.zip > release-upload/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-upload/*
          generate_release_notes: true
